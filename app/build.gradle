plugins {
    id "com.android.application"
}

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def releaseStorePassword = keystoreProps["storePassword"] ?: System.getenv("MUSIC_STORE_PASSWORD")
def releaseKeyAlias = keystoreProps["keyAlias"] ?: System.getenv("MUSIC_KEY_ALIAS")
def releaseKeyPassword = keystoreProps["keyPassword"] ?: System.getenv("MUSIC_KEY_PASSWORD")
def hasReleaseSigning = rootProject.file(keystoreProps["storeFile"] ?: "music_for_life.keystore").exists()
        && releaseStorePassword
        && releaseKeyAlias
        && releaseKeyPassword

android {
    namespace "com.carrot.heartbeatmusic"
    compileSdk 36

    defaultConfig {
        applicationId "com.carrotstore.heartbeatmusic"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName "1.0.0"
        buildConfigField "String", "MUSIC_API_BASE", "\"https://heartbeatplay.com/api.php\""
        buildConfigField "String", "REMOVE_ADS_PRODUCT_ID", "\"com.carrotstore.heartbeatmusic.removeads\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(keystoreProps["storeFile"] ?: "music_for_life.keystore")
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    flavorDimensions "device"
    productFlavors {
        mobile {
            dimension "device"
            applicationId "com.carrotstore.heartbeatmusic"
            resValue "string", "app_name", "Heartbeat Music"
            resValue "string", "admob_app_id", "ca-app-pub-5388516931803092~9346612767"
        }
        tv {
            dimension "device"
            applicationId "com.carrot.heartbeatmusic.tv"
            versionNameSuffix "-tv"
            resValue "string", "app_name", "Heartbeat Music TV"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            buildConfigField "String", "INTERSTITIAL_AD_UNIT_ID", "\"ca-app-pub-5388516931803092/2098678137\""
        }
        release {
            minifyEnabled true
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            buildConfigField "String", "INTERSTITIAL_AD_UNIT_ID", "\"ca-app-pub-5388516931803092/2098678137\""
        }
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.9.1"
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-session:1.5.1"
    implementation "androidx.media3:media3-ui:1.5.1"
    implementation "com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava"
    mobileImplementation "com.android.billingclient:billing:9.1.0"
    mobileImplementation "com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.6.0"
    mobileImplementation "com.google.android.ump:user-messaging-platform:4.0.0"
}
